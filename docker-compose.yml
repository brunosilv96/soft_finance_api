services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: bs-aesthetics-api
    container_name: bs-aesthetics
    ports:
      - 8000:8000
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:123456@postgres:5432/bs-aesthetics-db"
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.1-alpine
    container_name: bs-aesthetics-postgres
    environment:
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: bs-aesthetics
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
